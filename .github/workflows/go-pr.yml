name: golangci-lint
on:
  pull_request:
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.0.0
        with:
          version: "v2.8.0"
      - name: test
        run: go test -v ./...
